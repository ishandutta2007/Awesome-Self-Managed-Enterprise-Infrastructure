<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="lineGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="lineGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="serverGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>

    <style>
      .pulse-glow {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .node-flow {
        stroke-dasharray: 8 12;
        animation: flow 20s linear infinite;
      }
      .node-flow-rev {
        stroke-dasharray: 6 10;
        animation: flowRev 15s linear infinite;
      }
      .float-pill {
        animation: float 6s ease-in-out infinite alternate;
      }
      .float-pill-2 {
        animation: float 5s ease-in-out infinite alternate-reverse;
      }
      .blink {
        animation: blinkLed 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes flow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 160; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes blinkLed {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />
  <rect width="1200" height="360" fill="url(#serverGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="pulse-glow" transform="translate(600, 180)">
    <circle cx="-350" cy="-60" r="140" fill="#38bdf8" opacity="0.12" filter="blur(40px)" />
    <circle cx="350" cy="50" r="160" fill="#818cf8" opacity="0.12" filter="blur(40px)" />
    <circle cx="0" cy="80" r="100" fill="#c084fc" opacity="0.08" filter="blur(35px)" />
  </g>

  <!-- Animated Data Highway Streams in Background -->
  <g opacity="0.4">
    <path class="node-flow" d="M -50 90 Q 300 20, 600 90 T 1250 80" fill="none" stroke="url(#lineGlow1)" stroke-width="2" />
    <path class="node-flow-rev" d="M -50 280 Q 350 320, 700 270 T 1250 290" fill="none" stroke="url(#lineGlow2)" stroke-width="2" />
    <path class="node-flow" d="M 50 -20 Q 250 180, 50 380" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
    <path class="node-flow-rev" d="M 1150 -20 Q 950 180, 1150 380" fill="none" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.5" />
  </g>

  <!-- Server Rack / Data Center Visual Accents (Left & Right) -->
  <g opacity="0.45" transform="translate(45, 110)">
    <!-- Left Rack Graphic -->
    <rect x="0" y="0" width="70" height="140" rx="8" fill="#131d31" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" />
    <line x1="8" y1="28" x2="62" y2="28" stroke="#1e293b" stroke-width="2" />
    <line x1="8" y1="56" x2="62" y2="56" stroke="#1e293b" stroke-width="2" />
    <line x1="8" y1="84" x2="62" y2="84" stroke="#1e293b" stroke-width="2" />
    <line x1="8" y1="112" x2="62" y2="112" stroke="#1e293b" stroke-width="2" />
    <circle cx="16" cy="14" r="3" fill="#10b981" class="blink" style="animation-delay: 0.1s;" />
    <circle cx="26" cy="14" r="3" fill="#38bdf8" class="blink" style="animation-delay: 0.6s;" />
    <circle cx="16" cy="42" r="3" fill="#10b981" class="blink" style="animation-delay: 0.3s;" />
    <circle cx="26" cy="42" r="3" fill="#38bdf8" class="blink" style="animation-delay: 0.8s;" />
    <circle cx="16" cy="70" r="3" fill="#38bdf8" class="blink" style="animation-delay: 1.1s;" />
    <circle cx="16" cy="98" r="3" fill="#10b981" class="blink" style="animation-delay: 0.5s;" />
    <circle cx="16" cy="126" r="3" fill="#10b981" class="blink" style="animation-delay: 0.9s;" />
  </g>

  <g opacity="0.45" transform="translate(1085, 110)">
    <!-- Right Rack Graphic -->
    <rect x="0" y="0" width="70" height="140" rx="8" fill="#131d31" stroke="rgba(192,132,252,0.3)" stroke-width="1.5" />
    <line x1="8" y1="28" x2="62" y2="28" stroke="#1e293b" stroke-width="2" />
    <line x1="8" y1="56" x2="62" y2="56" stroke="#1e293b" stroke-width="2" />
    <line x1="8" y1="84" x2="62" y2="84" stroke="#1e293b" stroke-width="2" />
    <line x1="8" y1="112" x2="62" y2="112" stroke="#1e293b" stroke-width="2" />
    <circle cx="16" cy="14" r="3" fill="#10b981" class="blink" style="animation-delay: 0.2s;" />
    <circle cx="26" cy="14" r="3" fill="#c084fc" class="blink" style="animation-delay: 0.7s;" />
    <circle cx="16" cy="42" r="3" fill="#c084fc" class="blink" style="animation-delay: 1.2s;" />
    <circle cx="16" cy="70" r="3" fill="#10b981" class="blink" style="animation-delay: 0.4s;" />
    <circle cx="16" cy="98" r="3" fill="#38bdf8" class="blink" style="animation-delay: 1.4s;" />
    <circle cx="16" cy="126" r="3" fill="#10b981" class="blink" style="animation-delay: 0.6s;" />
  </g>

  <!-- Dynamic Floating Decorative Tech Pills (Subtle, Background/Sides) -->
  <g class="float-pill">
    <g transform="translate(140, 50)">
      <rect width="130" height="32" rx="16" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="65" y="20" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">⚡ Self-Hosted</text>
    </g>
  </g>
  <g class="float-pill-2">
    <g transform="translate(930, 50)">
      <rect width="130" height="32" rx="16" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
      <text x="65" y="20" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">🛡️ Zero Lock-In</text>
    </g>
  </g>

  <!-- Dynamic Foreground Content: Main Header, Subtitle, and Categorical Chips -->
  <g transform="translate(600, 105)" text-anchor="middle">
    <!-- Super-tag -->
    <rect x="-165" y="-38" width="330" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="0" y="-21" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE CLOUD ARCHITECTURE</text>

    <!-- Main Title (Guaranteed Sharp Foreground) -->
    <text x="0" y="32" fill="url(#primaryText)" font-size="34" font-weight="800" letter-spacing="-0.5">Awesome Self-Managed Enterprise Infrastructure</text>

    <!-- Subtitle -->
    <text x="0" y="70" fill="#94a3b8" font-size="16" font-weight="400">
      Curated On-Premises Platforms, Private Cloud Stacks, HCI &amp; Open-Source Alternatives
    </text>

    <!-- Architecture Pillars (Foreground Tags) -->
    <g transform="translate(0, 115)">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="72.5" y="21" fill="#e2e8f0" font-size="12.5" font-weight="600">🖥️ Hypervisors &amp; HCI</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-155, 0)">
        <rect x="0" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="70" y="21" fill="#e2e8f0" font-size="12.5" font-weight="600">☸️ Kubernetes &amp; K8s</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(5, 0)">
        <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="75" y="21" fill="#e2e8f0" font-size="12.5" font-weight="600">💾 Software Storage</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="72.5" y="21" fill="#e2e8f0" font-size="12.5" font-weight="600">🚀 GitOps &amp; CI/CD</text>
      </g>
    </g>

    <!-- Bottom Metadata Indicator -->
    <text x="0" y="195" fill="#64748b" font-size="12" font-weight="500">
      Production-Ready • Air-Gapped Capable • Sovereign Cloud Aligned • Apache 2.0 &amp; MIT
    </text>
  </g>
</svg>
